{% extends "base.html" %}

{% block content %}
  <article>
    <header>
      <h2>{{ trail.title }}</h2>
      <p><mark>{{ trail.difficulty }}</mark></p>
    </header>

    <img src="{{ trail.imageUrl }}" alt="{{ trail.title }}" />

    {{ trail.description | safe }}

    <p>
      <strong>Region:</strong> {{ trail.regionName }}, {{ trail.regionCountry }}
    </p>
    <p><strong>Distance:</strong> {{ trail.distanceKm }} km</p>
    <p><strong>Added:</strong> {{ trail.formattedCreatedAt }}</p>

    <footer>
      <a href="/regions">Back to regions</a>
    </footer>
  </article>
{% endblock %}
